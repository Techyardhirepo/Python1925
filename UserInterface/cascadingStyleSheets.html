<!Doctype html>

<html>
  
   <head>

     <style>
        
        body{   /* Element Type Selector  */
            background-color: brown;
            display: flex;
             top: 100px;
             margin-right: 500px;
             align-items: center;
             justify-content: center;
        }
        
        div {  /* Element Type Selector  */
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif ;
        }
         
        .textbox{  /* Class Selector  */
             background-color: rgb(61, 42, 42);
             height: 300px;
            
        }

        #txtLastName{  /* ID Selector  */
            height: 300px;
        }


     </style>

   </head>

<div style="display: flex; 
  justify-content: center; /* Centers horizontally */
  align-items: center;">
    
    <div style="display: grid;
  grid-template-columns: 1fr; /* Creates a single column */

  <div > 
      <label style="font-size: 20px; color: aliceblue;">First Name</label>

    <div>

      <input type="text" id="txtLastName" class="textbox">
    </div>
    <div>

    </div>
    <div>
